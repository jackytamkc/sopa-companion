<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SoPA companion</title>
  <!-- The SoPA companion icon (desktop/sopa-companion.svg), minified. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='tile' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230a1d38'/%3E%3Cstop offset='1' stop-color='%2309505f'/%3E%3C/linearGradient%3E%3ClinearGradient id='sheen' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23fff' stop-opacity='.07'/%3E%3Cstop offset='.5' stop-color='%23fff' stop-opacity='0'/%3E%3C/linearGradient%3E%3CradialGradient id='halo'%3E%3Cstop offset='0' stop-color='%23ff4fa3' stop-opacity='.95'/%3E%3Cstop offset='.45' stop-color='%23ff4fa3' stop-opacity='.45'/%3E%3Cstop offset='1' stop-color='%23ff4fa3' stop-opacity='0'/%3E%3C/radialGradient%3E%3CradialGradient id='hot'%3E%3Cstop offset='0' stop-color='%23ff8cc6'/%3E%3Cstop offset='.6' stop-color='%23ff4fa3' stop-opacity='.9'/%3E%3Cstop offset='1' stop-color='%23ff4fa3' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect x='3' y='3' width='42' height='42' rx='9' fill='url(%23tile)'/%3E%3Crect x='3' y='3' width='42' height='42' rx='9' fill='url(%23sheen)'/%3E%3Crect x='3.5' y='3.5' width='41' height='41' rx='8.5' fill='none' stroke='%23fff' stroke-opacity='.1'/%3E%3Cg fill='%23a9d3e3'%3E%3Cpath d='M26 20H29V6H36V9H39V12H42V27H26Z' fill-opacity='.3'/%3E%3Cpath d='M6 26H15V29H21V42H12V39H9V36H6Z' fill-opacity='.2'/%3E%3Cpath d='M23 29H42V36H39V39H36V42H23Z' fill-opacity='.25'/%3E%3C/g%3E%3Cpath d='M7 13H10V10H13V7H26V17H23V26H18V23H7Z' fill='%23fff' fill-opacity='.28'/%3E%3Cpath d='M6 12H9V9H12V6H27V18H24V27H17V24H6ZM7 13V23H18V26H23V17H26V7H13V10H10V13Z' fill='%23fff' fill-rule='evenodd'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='12' cy='13' r='1' fill-opacity='.75'/%3E%3Ccircle cx='11' cy='20' r='1' fill-opacity='.6'/%3E%3C/g%3E%3Cg fill='%23cfe8f2'%3E%3Ccircle cx='34' cy='14' r='1' fill-opacity='.45'/%3E%3Ccircle cx='37' cy='22' r='1' fill-opacity='.4'/%3E%3Ccircle cx='31' cy='25' r='1' fill-opacity='.35'/%3E%3Ccircle cx='12' cy='31' r='1' fill-opacity='.35'/%3E%3Ccircle cx='17' cy='37' r='1' fill-opacity='.3'/%3E%3Ccircle cx='27' cy='32' r='1' fill-opacity='.35'/%3E%3Ccircle cx='36' cy='35' r='1' fill-opacity='.35'/%3E%3C/g%3E%3Cg opacity='.75'%3E%3Ccircle cx='16.5' cy='15.5' r='5.1' fill='url(%23halo)'/%3E%3Ccircle cx='16.5' cy='15.5' r='2.8' fill='url(%23hot)'/%3E%3Ccircle cx='16.5' cy='15.5' r='1.35' fill='%23fff2f8'/%3E%3C/g%3E%3Cg opacity='.9'%3E%3Ccircle cx='20.5' cy='20.5' r='6' fill='url(%23halo)'/%3E%3Ccircle cx='20.5' cy='20.5' r='2.8' fill='url(%23hot)'/%3E%3Ccircle cx='20.5' cy='20.5' r='1.5' fill='%23fff2f8'/%3E%3C/g%3E%3Cg%3E%3Ccircle cx='23.5' cy='12.5' r='6.6' fill='url(%23halo)'/%3E%3Ccircle cx='23.5' cy='12.5' r='2.8' fill='url(%23hot)'/%3E%3Ccircle cx='23.5' cy='12.5' r='1.6' fill='%23fff2f8'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/app.css">
  <link rel="stylesheet" href="./src/qc.css">
  <link rel="stylesheet" href="./src/qc-deeper.css">
  <link rel="stylesheet" href="./src/qc-test-corner.css">
<link rel="stylesheet" href="./src/setting-demo.css">
  <link rel="stylesheet" href="./src/compare.css">
  <link rel="stylesheet" href="./src/stain-patches.css">
  <link rel="stylesheet" href="./src/stain-exclusions.css">
<link rel="stylesheet" href="./src/explain.css">
  <!-- First: the tab signs in, the launch code taken out of its address, and its requests carry the page's key
       (page-key.mjs). -->
  <script type="module" src="./src/page-key.mjs"></script>
  <!-- A notebook session's tab keeps its own storage: set up before the page reads any (storage-boot.mjs). -->
  <script type="module" src="./src/storage-boot.mjs"></script>
  <script type="module" src="./src/main.js"></script>
  <!-- The Log button works on its own, also when the rest of the page did not start (log-export.mjs imports only
       page-key.mjs, which has no imports). -->
  <script type="module" src="./src/log-export.mjs"></script>
</head>
<body>
    <!-- The browser cannot draw (no WebGL2): main.js says so here, in place of the page, and starts nothing else. -->
    <section id="no-webgl" class="no-webgl" role="alert" hidden>
      <h1 id="no-webgl-title"></h1>
      <p id="no-webgl-why"></p>
      <p id="no-webgl-help" class="muted"></p>
    </section>
<div id="app" class="shell">
  <header class="app-header">
    <!-- The name users see; a press goes back to the first screen's two tools, after saving or discarding the run. -->
    <button id="home" class="brand" type="button" title="Back to the first screen"><span class="brand-mark"></span>SoPA <b>companion</b></button>
    <span id="tool-name" class="tool-name" hidden></span>
    <button id="open-sample" type="button">Open sample…</button>
    <span id="sample-name"></span>
    <button id="new-run" class="primary" type="button">New run</button>
    <div class="spacer"></div>
    <!-- Compare: the run's cells beside the sample's other segmentations (compare.mjs). -->
    <button id="compare-button" type="button">Compare</button>
    <button id="log-button" type="button" title="Save a text log of this session and the open run, to look into a problem">Log</button>
    <span id="connection" class="connection" title="Connecting…"></span>
    <button id="close-app" type="button" title="Close SoPA companion">Close</button>
  </header>

  <main class="stage-wrap">
    <canvas id="stage" class="stage" aria-label="Segmentation view" tabindex="0"></canvas>
    <canvas id="overlay" class="stage overlay"></canvas>

    <div id="hud" class="hud" hidden>
      <div class="hud-phase"><i id="hud-dot"></i><span id="hud-phase">Burn-in</span></div>
      <div class="hud-iter"><span id="hud-iter">0</span><small id="hud-total">/ 0</small></div>
      <div class="hud-sub" id="hud-sub"></div>
    </div>
    <div id="hud-state" class="hud-state" hidden></div>
    <div id="qc-chip" class="qc-chip-host" hidden></div>

    <p id="prior-hint" class="prior-hint" role="status" hidden></p>
    <p id="tiled-hint" class="tiled-hint muted small" role="status" hidden></p>
    <div id="tooltip" class="tooltip" hidden></div>
    <div class="scale" id="scale"><span id="scale-label">50 µm</span><i id="scale-bar"></i></div>
    <button id="fit" class="icon-button fit" type="button" title="Fit view (F)">⤢</button>

    <section id="picker" class="picker card" hidden>
      <div class="picker-sample"><strong id="picker-name"></strong><span id="picker-sample-info" class="muted small"></span>
        <!-- What the open found about the sample, a line each with an ⓘ (sample-notes.mjs). -->
        <div id="picker-notes" class="picker-notes" hidden></div></div>
      <!-- The run type is the page's one record of what Start makes, set by the tool chosen on the first screen and by
           the Training patches section below: never shown. -->
      <label hidden><span data-stain-copy="kind"></span><select id="run-kind">
        <option value="proseg" data-stain-copy="proseg"></option><option value="stain" data-stain-copy="title"></option><option value="patches" data-patch-copy="title"></option>
      </select></label>
      <div id="stain-picker" hidden>
        <!-- Training patches, a tool inside Stain segmentation: open, its boxes are suggested on the image and Start makes them. -->
        <details id="patch-tool" class="tool-section">
          <summary data-patch-copy="title"></summary>
          <div id="patch-picker" hidden>
          <p class="muted small" data-patch-copy="toolHelp"></p>
          <label><span data-patch-copy="count"></span><input id="patch-count" type="number" min="1" max="64" value="8"></label>
          <label><span data-patch-copy="size"></span><input id="patch-size" type="number" min="64" max="4096" value="256"></label>
          <p id="patch-size-scale" class="muted small"></p>
          <p id="patch-size-note" class="muted small" data-patch-copy="large" hidden></p>
          <label><span data-patch-copy="startFrom"></span><select id="patch-start-from">
            <option value="model" data-patch-copy="model"></option><option value="empty" data-patch-copy="blank"></option>
          </select></label>
          </div>
        </details>
        <!-- The methods the engine offers (health's stain.methods, main.js offerStainMethods): Cellpose's alone unless
             it offers another; the row shows only when there is a choice (updateStainMethod). -->
        <label><span data-stain-copy="method"></span><select id="stain-method">
          <option value="cellpose" data-stain-copy="cellpose"></option>
        </select></label>
        <!-- While the model list loads (main.js showModelsLoading): a static spinner beside it, its words inside it. -->
        <label class="model-row"><span data-stain-copy="model"></span><select id="stain-model"></select><span
          id="stain-model-loading" class="spinner" aria-hidden="true" hidden></span></label>
        <label><span data-stain-copy="image"></span><select id="stain-image"></select></label>
        <label><span>Resolution</span><select id="stain-level"><option value="0">scale0</option></select></label>
        <p id="stain-resolution-info" class="muted small"></p>
        <p id="stain-resolution-warning" class="save-warning small" hidden></p>
        <label class="row toggle"><input id="stain-tissue" type="checkbox" checked><span data-stain-copy="tissue"></span></label>
        <div id="stain-cellpose-options">
        <label><span data-stain-copy="nucleus"></span><select id="stain-nucleus"></select></label>
        <label><span data-stain-copy="cytoplasm"></span><select id="stain-cytoplasm"></select></label>
        <div id="stain-tuning">
        <button id="stain-use-settings" type="button">Use settings from Cellpose</button>
        <p id="stain-settings-reason" class="muted small"></p>
        <div id="stain-settings-report" class="muted small" aria-live="polite"></div>
        <label><span data-stain-copy="diameter"></span><input id="stain-diameter" type="number" min="10" max="1000" value="30" disabled></label>
        <label class="row toggle"><input id="stain-auto" type="checkbox" checked><span data-stain-copy="auto"></span></label>
        <p class="muted small" data-stain-copy="autoHelp"></p>
        <label><span data-stain-copy="flow"></span><input id="stain-flow" type="number" min="0" max="10" step="0.1" value="0.4"></label>
        <label><span data-stain-copy="probability"></span><input id="stain-probability" type="number" min="-20" max="20" step="0.1" value="0"></label>
        <details id="stain-more">
          <summary data-stain-copy="more"></summary>
          <label><span data-stain-copy="niter"></span><input id="stain-niter" type="number" min="1" placeholder="Auto"></label>
          <p class="muted small" data-stain-copy="niterHelp"></p>
          <label><span data-stain-copy="minSize"></span><input id="stain-min-size" type="number" min="-1" max="100000" value="15"></label>
          <label class="row toggle"><input id="stain-augment" type="checkbox"><span data-stain-copy="augment"></span></label>
          <label class="row toggle"><input id="stain-normalize" type="checkbox" checked><span data-stain-copy="normalize"></span></label>
          <label class="row toggle"><input id="stain-fixed-range" type="checkbox"><span data-stain-copy="fixedRange"></span></label>
          <label><span data-stain-copy="intensityLow"></span><input id="stain-intensity-low" type="number" min="-1000000000" max="1000000000" step="any" disabled></label>
          <label><span data-stain-copy="intensityHigh"></span><input id="stain-intensity-high" type="number" min="-1000000000" max="1000000000" step="any" disabled></label>
          <label><span data-stain-copy="low"></span><input id="stain-low" type="number" min="0" max="100" step="any" value="1"></label>
          <label><span data-stain-copy="high"></span><input id="stain-high" type="number" min="0" max="100" step="any" value="99"></label>
          <label><span data-stain-copy="tileNorm"></span><input id="stain-tile-norm" type="number" min="0" value="0"></label>
          <label><span data-stain-copy="sharpen"></span><input id="stain-sharpen" type="number" min="0" step="any" value="0"></label>
          <label><span data-stain-copy="smooth"></span><input id="stain-smooth" type="number" min="0" step="any" value="0"></label>
          <label class="row toggle"><input id="stain-invert" type="checkbox"><span data-stain-copy="invert"></span></label>
        </details>
        </div>
        </div>
        <div id="stain-instanseg-options" hidden>
          <label><span data-stain-copy="channels"></span><select id="stain-channels" multiple size="4"></select></label>
          <p class="muted small" data-stain-copy="channelsHelp"></p>
          <div id="stain-instanseg-tuning">

          <label><span data-stain-copy="output"></span><select id="stain-output">
            <option value="cells" data-stain-copy="cells"></option><option value="nuclei" data-stain-copy="nuclei"></option>
          </select></label>
          <label class="row toggle"><input id="stain-resolve" type="checkbox"><span data-stain-copy="resolve"></span></label>
          </div>
        </div>
      </div>
      <div id="proseg-picker">
      <h2>Prior <small class="muted">Where cells start</small></h2>
      <div class="prior-selects">
        <label>Start from<select id="prior-choice"></select></label>
      </div>
      <p class="muted small">Proseg starts its cells from the prior you choose.</p>
      <label class="row toggle"><input type="checkbox" id="show-prior" checked> Show prior outlines</label>
      <p id="prior-preview-note" class="muted small" aria-live="polite"></p>
      </div>
      <!-- The sample's other segmentations on the overview (Layers > Load Other Mask without fields: layer-panel.js). -->
      <div id="picker-segmentations" class="layer-list"></div>
      <h2>Region</h2>
      <div class="segmented" id="region-mode" role="radiogroup" aria-label="Region">
        <button type="button" data-value="box" aria-pressed="true">Rectangle</button>
        <button type="button" data-value="polygon" aria-pressed="false">Lasso</button>
        <button type="button" data-value="full" aria-pressed="false">Full sample</button>
      </div>
      <p id="region-help" class="muted small"></p>
      <div class="picker-size"><span id="picker-size"></span><span id="picker-area" class="muted"></span><span id="picker-mode" class="muted"></span></div>
      <p id="picker-hint" class="muted small" aria-live="polite"></p>
      <details class="advanced" id="proseg-advanced"><summary><span>Advanced proseg options</span><button id="options-guide-toggle" class="guide-toggle" type="button">Which knob should I change?</button></summary><div id="options-guide" class="knob-guide" hidden></div><div id="proseg-options" class="options-scroll"></div></details>
      <p id="picker-qc" class="muted small" role="status" hidden></p>
      <button id="start" class="primary big" type="button">Start segmenting</button>
      <p id="picker-error" class="error" role="alert" hidden></p>
    </section>

    <!-- The first screen: two tools, then the chosen one's Open sample… and the shared Recent list.
         The cards' words are shell.mjs TOOLS (a test keeps them equal). -->
    <div id="empty" class="empty" hidden>
      <!-- The engine did not answer the page's first requests (main.js boot): said in place of the tools, with Reload. -->
      <section id="engine-down" class="engine-down" role="alert" hidden>
        <h1 id="engine-down-title"></h1>
        <p id="engine-down-why" class="muted"></p>
        <button id="engine-reload" class="primary big" type="button"></button>
      </section>
      <section id="tool-choice" class="tool-choice">
        <h1>SoPA companion</h1>
        <p id="tool-choose" class="muted">Choose a tool to begin.</p>
        <!-- A notebook's session: its SpatialData loading (a static spinner, the words and, once its size is known, a bar
             of what is prepared), or why it could not be opened (session.mjs). -->
        <p id="session-status" class="session-status" role="status" hidden><span id="session-spinner" class="spinner"></span><span id="session-status-text"></span><progress id="session-progress" class="session-progress" max="1" hidden></progress></p>
        <div class="tool-cards">
          <button id="tool-stain" class="tool-card" type="button"><strong>Stain segmentation</strong><span>Find cells in the sample's images with Cellpose, clean them up, and make training patches for the Cellpose GUI.</span><span id="tool-stain-wait" class="tool-wait" hidden><span class="spinner"></span><span id="tool-stain-wait-text"></span></span></button>
          <button id="tool-proseg" class="tool-card" type="button"><strong>Proseg Live</strong><span>Watch proseg build cells from the transcripts, one iteration at a time, with the ResolVI mixing check and Go deeper.</span><span id="tool-proseg-wait" class="tool-wait" hidden><span class="spinner"></span><span id="tool-proseg-wait-text"></span></span></button>
        </div>
      </section>
      <section id="tool-start" class="tool-start" hidden>
        <button id="tool-back" class="text-button tool-back" type="button" title="Back to the two tools">‹ Both tools</button>
        <h1 id="tool-title"></h1>
        <p id="tool-help" class="muted"></p>
        <button id="empty-open-sample" class="primary big" type="button">Open sample…</button>
        <section id="recent" class="recent"><h2>Recent</h2><div id="recent-samples"></div></section>
      </section>
    </div>
  </main>

  <aside class="side">
    <!-- The mixing check first: off (the default) it is one compact line with its switch, always in view. -->
    <details class="panel qc-panel" id="qc-panel" open hidden></details>

    <details class="panel" id="display-panel" open>
      <summary>Layers</summary>
      <div class="segmented view-switch" id="view" role="radiogroup" aria-label="View dimension">
        <button type="button" data-value="2d" aria-pressed="true" title="2-D view (V)">2-D</button>
        <button type="button" data-value="3d" aria-pressed="false" title="3-D: drag to orbit, right/shift-drag to pan, wheel to zoom (V)">3-D</button>
      </div>
      <label class="row toggle"><input type="checkbox" id="transcripts" checked title="Toggle transcripts (X)"> Transcripts</label>
      <label class="row stretch" id="z-stretch-row" hidden>Z stretch
        <input type="range" id="z-stretch" min="-2" max="2" step="0.05" value="0" aria-label="Z stretch">
        <output id="z-stretch-value" for="z-stretch">×1.5 real</output>
      </label>
      <div class="segmented modes" id="mode" role="radiogroup" aria-label="Mask display">
        <button type="button" data-value="cells" aria-pressed="true" title="Filled cells with outlines (1)">Cells</button>
        <button type="button" data-value="outlines" aria-pressed="false" title="Outlines over the image (2)">Outlines</button>
      </div>
      <label class="row toggle"><input type="checkbox" id="trails" checked> Flash each iteration's changes</label>
      <label class="row slider">Fill <input type="range" id="fill" min="0" max="1" step="0.01" value="0.42"></label>
      <label class="row slider">Image <input type="range" id="gain" min="0" max="2.5" step="0.01" value="1"></label>
      <div class="channels" id="channels"></div>
      <div class="layers" id="layers-row" hidden>
        <span class="muted">Z layer</span>
        <div class="segmented small" id="layers" role="radiogroup" aria-label="Z layer"></div>
      </div>
    </details>

    <details class="panel" id="now-panel" open hidden>
      <summary>This iteration</summary>
      <dl class="facts" id="facts"></dl>
      <div id="cell-card" class="cell-card" hidden></div>
      <p class="muted small" id="phase-help"></p>
    </details>

    <details class="panel" id="knobs-panel" open hidden><summary>Live knobs</summary><button id="live-guide-toggle" class="guide-toggle" type="button">Which knob should I change?</button><div id="live-guide" class="knob-guide" hidden></div><p class="muted small">Applies from the next iteration</p><div id="live-knobs"></div></details>
    <section id="stain-patches" aria-label="Training patches" hidden></section>
    <section id="stain-exclusions" aria-label="Removed areas" hidden>
      <div id="stain-exclude-tools">
        <button id="stain-exclude" type="button">Remove cells in an area</button>
        <button id="stain-exclude-undo" type="button" title="Undo the last change (Ctrl+Z)">Undo</button>
        <button id="stain-exclude-redo" type="button" title="Redo what was undone (Ctrl+Shift+Z)">Redo</button>
      </div>
      <p id="stain-exclude-help" class="muted small"></p>
      <!-- The cell size and brightness ranges (stain-exclusions.mjs builds them: range-chooser.mjs). -->
      <div id="stain-exclude-size-row"></div>
      <p id="stain-exclude-sizes" class="muted small"></p>
      <div id="stain-exclude-bright-row"><select id="stain-exclude-bright-channel" aria-label="Channel"></select></div>
      <p id="stain-exclude-brights" class="muted small"></p>
      <p><span id="stain-exclude-total"></span> <span id="stain-exclude-status" class="muted" role="status"></span></p>
    </section>
    <details class="panel" id="run-panel" open hidden>
      <summary>Run/results</summary>
      <dl class="facts" id="run-facts"></dl>
      <p class="error" id="run-error" hidden></p><p id="retry-note" class="muted small" hidden></p><div id="results" class="results" hidden></div>
    </details>
  </aside>

  <footer class="dock" id="dock" hidden>
    <div class="controls">
      <div class="group">
        <button id="run-toggle" class="primary" type="button" title="Pause or resume proseg (Space)">Pause</button>
        <button id="run-step" type="button" title="Run exactly one more iteration (S)" disabled>Step</button>
        <button id="run-stop" type="button" title="Finish sampling and save proseg's results from here">Finish &amp; save</button><details class="overflow"><summary aria-label="More run actions">•••</summary><button id="run-abort" class="danger" type="button">Abort without saving</button></details>
      </div>
      <div class="group">
        <span class="muted">Speed</span>
        <div class="segmented small" id="speed" role="radiogroup" aria-label="Proseg speed">
          <button type="button" data-value="max" aria-pressed="true" title="As fast as proseg can go">Max</button>
          <button type="button" data-value="fast" aria-pressed="false" title="At most about 8 iterations per second">Fast</button>
          <button type="button" data-value="slow" aria-pressed="false" title="At most 2 iterations per second">Slow</button>
        </div>
      </div>
      <div class="group view">
        <button id="first" class="icon-button" type="button" title="First iteration (Home)">⏮</button>
        <button id="prev" class="icon-button" type="button" title="Previous iteration (←)">◀</button>
        <button id="replay" class="icon-button" type="button" title="Replay from here (R)">⟲</button>
        <button id="next" class="icon-button" type="button" title="Next iteration (→)">▶</button>
        <button id="last" class="icon-button" type="button" title="Latest iteration (End)">⏭</button>
        <button id="live" class="live" type="button" aria-pressed="true" title="Follow new iterations as they arrive (L)"><i></i>Live</button>
      </div>
      <div class="status" id="status"></div>
    </div>
    <canvas id="timeline" class="timeline" aria-label="Iteration timeline"></canvas>
  </footer>
</div>
<div id="notice" class="notice" role="status" hidden></div>
<!-- Compare's full-screen view, a modal dialog over the run page, is built here (compare.mjs). -->
<div id="compare-host"></div>
</body>
</html>
