# proseg-live (proseg 3.2.0 with the app's live-mode patch, GPL v3): its source distribution, wheels built from it
# (Linux x86-64 and ARM64, manylinux_2_28), and smoke tests; macOS on Apple silicon and Windows x64 too when asked
# (other_systems, as tests.yml: release.yml asks), so a push's checks stay on Linux's runners. Called by release.yml;
# also runs when native/ changes. Every action is pinned to the commit of the release named beside it.
name: proseg-live
on:
  workflow_call:
    inputs:
      other_systems: {type: boolean, default: false}
  workflow_dispatch:
    inputs:
      other_systems: {description: "Also macOS and Windows", type: boolean, default: false}
  push: {branches: [main], paths: ["native/**", ".github/workflows/proseg-live.yml"]}
  pull_request: {paths: ["native/**", ".github/workflows/proseg-live.yml"]}
permissions: {contents: read}
defaults: {run: {shell: bash}}
env: {MATURIN_VERSION: "1.15.0"}
jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with: {persist-credentials: false}
      - run: native/build.sh --package build/package
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b       # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --manifest-path build/package/proseg-live-3.2.0/Cargo.toml --out dist
      - run: python3 native/package/check.py sdist dist/proseg_live-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with: {name: proseg-live-sdist, path: dist/*.tar.gz}
  wheels:
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.other_systems && '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","manylinux":"2_28"},{"os":"ubuntu-24.04","target":"aarch64-unknown-linux-gnu","manylinux":"2_28"},{"os":"macos-15","target":"aarch64-apple-darwin","manylinux":""},{"os":"windows-2022","target":"x86_64-pc-windows-msvc","manylinux":""}]' || '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","manylinux":"2_28"},{"os":"ubuntu-24.04","target":"aarch64-unknown-linux-gnu","manylinux":"2_28"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: proseg-live-sdist, path: dist}
      - id: tree                               # the sdist's own top folder (maturin names it proseg_live-<version>)
        run: |
          mkdir -p build && tar -xzf dist/proseg_live-*.tar.gz -C build
          echo "manifest=$(ls build/*/Cargo.toml)" >> "$GITHUB_OUTPUT"
      # Neutral names in the program's panic messages, as native/build.sh writes them, for the folders of the computer
      # that builds it: the build container's cargo (maturin-action passes every RUST* variable into it, and mounts the
      # workspace at its own path), this runner's home, cargo's home and the workspace (deeper ones later: rustc takes
      # the last that matches); check.py fails the job when one is still named. Apple's and Microsoft's linkers write the
      # object files' own paths into a program built with debug info, after rustc's renaming: there it is built without.
      - name: Neutral names for the folders of the computer that builds it
        run: |
          home="$HOME" cargo="${CARGO_HOME:-$HOME/.cargo}" work="$GITHUB_WORKSPACE"
          if command -v cygpath > /dev/null; then home="$(cygpath -w "$home")" cargo="$(cygpath -w "$cargo")" work="$(cygpath -w "$work")"; fi
          echo "RUSTFLAGS=--remap-path-prefix=/root/.cargo=/cargo --remap-path-prefix=/usr/local/cargo=/cargo --remap-path-prefix=$home=~ --remap-path-prefix=$cargo=/cargo --remap-path-prefix=$work=/proseg-live" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" != "Linux" ]; then echo "CARGO_PROFILE_RELEASE_DEBUG=0" >> "$GITHUB_ENV"; fi
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b       # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out wheels --manifest-path ${{ steps.tree.outputs.manifest }}
      - run: python3 native/package/check.py wheel wheels/*.whl
        env: {CI: "true"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with: {name: "proseg-live-${{ matrix.target }}", path: wheels/*.whl}
  smoke:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.other_systems && '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"os":"macos-15","target":"aarch64-apple-darwin"},{"os":"windows-2022","target":"x86_64-pc-windows-msvc"}]' || '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0      # v7.1.0
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: "proseg-live-${{ matrix.target }}", path: wheels}
      - run: |
          python -m venv smoke
          py=smoke/bin/python; [ -x "$py" ] || py=smoke/Scripts/python.exe
          "$py" -m pip install wheels/*.whl numpy pyarrow
          "$py" native/package/smoke.py
  smoke-arm64:
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: proseg-live-aarch64-unknown-linux-gnu, path: wheels}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - run: |
          docker run --rm --platform linux/arm64 -v "$PWD/wheels:/w" python:3.12-slim \
            sh -c 'pip install -q /w/*.whl && proseg-live --version' | grep -x "proseg 3.2.0"
